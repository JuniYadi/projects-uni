appId: com.univpn.desktop
productName: UniVPN
# ponytail: no code signing for MVP; Windows Defender may warn
copyright: Copyright © 2026 UniVPN
publish:
  provider: github
  owner: juniyadi
  repo: projects-uni
  releaseType: release
directories:
  output: dist
  buildResources: build-resources
files:
  - out/**/*
  - package.json
extraResources:
  # Tray icons (generated by scripts/gen-tray.ts)
  - from: resources/tray
    to: resources/tray
win:
  target:
    - nsis
    - portable
  artifactName: 'UniVPN-${version}-${arch}.${ext}'
  extraResources:
    # Compiled wg-helper for Windows WireGuard FFI (built via bun build --compile)
    - from: resources/wg-helper.exe
      to: wg-helper.exe
    # Windows WireGuard DLLs (place DLLs here before building for real tunnel)
    - from: resources/win
      to: resources/win
      filter:
        - '**/*'
nsis:
  oneClick: true
  artifactName: 'UniVPN-Setup-${version}-${arch}.${ext}'
mac:
  target:
    - dmg
    - zip
  artifactName: 'UniVPN-${version}-${arch}.${ext}'
  category: public.app-category.utilities
  identity: '-'
  hardenedRuntime: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  extraResources:
    # macOS WireGuard binaries (wireguard-go, wg, univpn-helper)
    - from: resources/mac
      to: resources/mac
      filter:
        - '**/*'
