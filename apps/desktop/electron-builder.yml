appId: com.univpn.desktop
productName: UniVPN
# ponytail: no code signing for MVP; Windows Defender may warn
copyright: Copyright © 2026 UniVPN
publish:
  provider: github
  owner: juniyadi
  repo: projects-uni
  releaseType: release
directories:
  output: dist
  buildResources: build-resources
files:
  - out/**/*
  - package.json
extraResources:
  # Tray icons (generated by scripts/gen-tray.ts)
  - from: resources/tray
    to: resources/tray
  # App runtime icons
  - from: resources/icon.png
    to: resources/icon.png
  - from: resources/icon.ico
    to: resources/icon.ico
win:
  target:
    - nsis
    - portable
  artifactName: 'UniVPN-${version}-${arch}.${ext}'
  icon: build-resources/icon.ico
  extraResources:
    # Compiled wg-helper for Windows WireGuard FFI (placed in win/ and resources root)
    - from: resources/wg-helper.exe
      to: win/wg-helper.exe
    - from: resources/wg-helper.exe
      to: wg-helper.exe
    # Windows WireGuard DLLs (tunnel.dll, wireguard.dll)
    # Placed in win/, resources/win/, and resources root to ensure co-location with wg-helper.exe
    - from: resources/win
      to: win
      filter:
        - '**/*'
    - from: resources/win
      to: resources/win
      filter:
        - '**/*'
    - from: resources/win
      to: .
      filter:
        - '**/*'
nsis:
  oneClick: true
  artifactName: 'UniVPN-Setup-${version}-${arch}.${ext}'
mac:
  target:
    - dmg
    - zip
  artifactName: 'UniVPN-${version}-${arch}.${ext}'
  icon: build-resources/icon.icns
  category: public.app-category.utilities
  identity: '-'
  hardenedRuntime: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  extraResources:
    # macOS WireGuard binaries (wireguard-go, wg, univpn-helper)
    - from: resources/mac
      to: resources/mac
      filter:
        - '**/*'
linux:
  icon: build-resources/icon.png
