name: Build Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (internal=dev API, production=prod API)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal

jobs:
  build-desktop:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && contains(github.event.release.tag_name, '-desktop'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            compile_cmd: bun run compile:helper
            dist_flags: --win
            artifact_name: univpn-desktop-windows
            artifact_path: apps/desktop/dist/*.exe
            release_files: 'apps/desktop/dist/*.exe'
          - os: macos-latest
            platform: macos
            compile_cmd: bun run compile:helper:mac
            dist_flags: --mac
            artifact_name: univpn-desktop-macos
            artifact_path: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
            release_files: 'apps/desktop/dist/*.dmg apps/desktop/dist/*.zip'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set API Environment & Version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.environment }}"
          echo "Processing Tag / Environment: $TAG"

          if [[ "$TAG" == *"-internal"* || "$TAG" == "internal" ]]; then
            echo "Building for INTERNAL environment (pfnapp.my.id)"
            echo "UNIVPN_API_BASE_URL=https://pfnapp.my.id/api/vpn/mobile" >> $GITHUB_ENV
          else
            echo "Building for PRODUCTION environment (pfnapp.id)"
            echo "UNIVPN_API_BASE_URL=https://pfnapp.id/api/vpn/mobile" >> $GITHUB_ENV
          fi

          # Sync package version from tag (e.g. v0.3.0-desktop -> 0.3.0)
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Setting desktop package version to $VERSION"
            npm pkg set version="$VERSION" --prefix apps/desktop
          fi

      - name: Compile helper
        run: ${{ matrix.compile_cmd }}
        working-directory: apps/desktop

      - name: Build desktop app
        run: bun run build
        working-directory: apps/desktop

      - name: Package with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bun run dist -- ${{ matrix.dist_flags }}
        working-directory: apps/desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          FILES=(${{ matrix.release_files }})
          if [ ${#FILES[@]} -gt 0 ]; then
            gh release upload "${{ github.event.release.tag_name }}" "${FILES[@]}" --clobber
          else
            echo "Warning: No release files found matching ${{ matrix.release_files }}"
          fi
