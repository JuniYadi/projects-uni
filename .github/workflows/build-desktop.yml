name: Build Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (internal=dev API, production=prod API)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - internal

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && contains(github.event.release.tag_name, '-desktop'))
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set API Environment & Version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.environment }}"
          echo "Processing Tag / Environment: $TAG"

          if [[ "$TAG" == *"-internal"* || "$TAG" == "internal" ]]; then
            echo "Building for INTERNAL environment (pfnapp.my.id)"
            echo "UNIVPN_API_BASE_URL=https://pfnapp.my.id/api/vpn/mobile" >> $GITHUB_ENV
          else
            echo "Building for PRODUCTION environment (pfnapp.id)"
            echo "UNIVPN_API_BASE_URL=https://pfnapp.id/api/vpn/mobile" >> $GITHUB_ENV
          fi

          # Sync package version from tag (e.g. v0.3.0-desktop -> 0.3.0)
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "Setting desktop package version to $VERSION"
            npm pkg set version="$VERSION" --prefix apps/desktop
          fi

      - name: Compile wg-helper
        run: bun run compile:helper
        working-directory: apps/desktop

      - name: Build desktop app
        run: |
          cd apps/desktop
          bun run build

      - name: Package with electron-builder
        run: |
          cd apps/desktop
          bun run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: univpn-desktop-windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish to GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" apps/desktop/dist/*.exe --clobber
