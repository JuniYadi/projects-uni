name: Build Android
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - testing

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Set API Environment
        shell: bash
        run: |
          if [ "${{ github.event.inputs.environment }}" = "testing" ]; then
            echo "Building for TESTING environment (pfnapp.my.id)"
            echo "EXPO_PUBLIC_API_BASE_URL=https://pfnapp.my.id/api/vpn/mobile" >> $GITHUB_ENV
            echo "EXPO_PUBLIC_APP_URL=https://pfnapp.my.id" >> $GITHUB_ENV
          else
            echo "Building for PRODUCTION environment (pfnapp.id)"
            API_URL="${{ secrets.EXPO_PUBLIC_API_BASE_URL }}"
            APP_URL="${{ secrets.EXPO_PUBLIC_APP_URL }}"
            echo "EXPO_PUBLIC_API_BASE_URL=${API_URL:-https://pfnapp.id/api/vpn/mobile}" >> $GITHUB_ENV
            echo "EXPO_PUBLIC_APP_URL=${APP_URL:-https://pfnapp.id}" >> $GITHUB_ENV
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: bun install

      - name: Prebuild Android
        run: bun expo prebuild --platform android
        working-directory: apps/mobile
        env:
          EXPO_NO_DOTENV: 1

      - name: Setup release signing
        if: env.KEYSTORE_BASE64 != ''
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_KEY_PASSWORD: ${{ secrets.KEY_KEY_PASSWORD }}
        run: |
          cd apps/mobile
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/my-upload-key.keystore

          # ensure trailing newline before appending
          echo "" >> android/gradle.properties
          cat >> android/gradle.properties << EOSIGN
          MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore
          MYAPP_UPLOAD_KEY_ALIAS=$KEY_ALIAS
          MYAPP_UPLOAD_STORE_PASSWORD=$KEY_STORE_PASSWORD
          MYAPP_UPLOAD_KEY_PASSWORD=$KEY_KEY_PASSWORD
          EOSIGN

          python3 << 'PYSIGN'
          with open('android/app/build.gradle') as f:
              c = f.read()

          release = (
              "\n        release {"
              "\n            storeFile file(MYAPP_UPLOAD_STORE_FILE)"
              "\n            storePassword MYAPP_UPLOAD_STORE_PASSWORD"
              "\n            keyAlias MYAPP_UPLOAD_KEY_ALIAS"
              "\n            keyPassword MYAPP_UPLOAD_KEY_PASSWORD"
              "\n        }"
          )
          c = c.replace('signingConfigs {', 'signingConfigs {' + release)
          c = c.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open('android/app/build.gradle', 'w') as f:
              f.write(c)
          PYSIGN

      - name: Build APK + AAB
        run: |
          # Increase heap for APK packaging (4 architectures + Hermes + native libs)
          sed -i 's/org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m/org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=512m/' android/gradle.properties
          cd android && ./gradlew assembleRelease bundleRelease --stacktrace
        working-directory: apps/mobile

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: app-release-apk-${{ github.event.release.tag_name }}
      #     path: apps/mobile/android/app/build/outputs/apk/release/*.apk

      # - uses: actions/upload-artifact@v7
      #   with:
      #     name: app-release-aab-${{ github.event.release.tag_name }}
      #     path: apps/mobile/android/app/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play (internal track)
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pfnapp.univpn
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          releaseName: ${{ github.event.release.tag_name || github.ref_name }}
          tracks: internal
          status: completed
          whatsNewDirectory: distribution/whatsnew
