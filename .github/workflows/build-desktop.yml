name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - testing
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/**'
      - '.github/workflows/build-desktop.yml'
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set API Environment
        shell: bash
        run: |
          if [ "${{ github.event.inputs.environment }}" = "testing" ]; then
            echo "Building for TESTING environment (pfnapp.my.id)"
            echo "UNIVPN_API_BASE_URL=https://pfnapp.my.id/api/vpn/mobile" >> $GITHUB_ENV
          else
            echo "Building for PRODUCTION environment (pfnapp.id)"
            echo "UNIVPN_API_BASE_URL=https://pfnapp.id/api/vpn/mobile" >> $GITHUB_ENV
          fi

      - name: Compile wg-helper
        run: bun run compile:helper
        working-directory: apps/desktop

      - name: Build desktop app
        run: |
          cd apps/desktop
          bun run build

      - name: Package with electron-builder
        run: |
          cd apps/desktop
          bun run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: univpn-desktop-windows
          path: apps/desktop/dist/*.exe
          if-no-files-found: error
